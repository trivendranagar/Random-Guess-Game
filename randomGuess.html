<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Number Challenge</title>

    <link rel="stylesheet" href="randomGuess.css">
</head>

<body>

    <div class="game-card">

        <h1>Random Number Challenge</h1>

        <p class="subtitle">
            Can you guess the secret number?
        </p>

        <!-- Game Setup -->
        <div id="setup">

            <label for="maxNumber">
                Choose maximum number
            </label>

            <input
                type="number"
                id="maxNumber"
                placeholder="Example: 100"
                min="1"
            >

            <button id="startBtn">
                Start Game
            </button>

        </div>


        <!-- Game Area -->
        <div id="gameArea" class="hidden">

            <p class="range-text">
                Guess a number between
                <strong>1</strong> and
                
                <strong id="maxDisplay"></strong>
            </p>

            <input
                type="number"
                id="guessInput"
                placeholder="Enter your guess"
            >

            <button id="guessBtn">
                Guess
            </button>

            <div id="message">
                Good luck!
            </div>

            <div class="attempts">
                Attempts:
                <strong id="attempts">0</strong>
            </div>

            <button id="newGameBtn">
                New Game
            </button>

        </div>

    </div>

    <script src="randomGuessGame.js"></script>

</body>
</html>
